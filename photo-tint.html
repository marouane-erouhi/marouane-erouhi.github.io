
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Tint Studio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #fff;
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.1);
        }

        .upload-area.dragover {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #e94560;
        }

        .upload-text {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .upload-hint {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            margin-top: 10px;
        }

        #fileInput {
            display: none;
        }

        .canvas-container {
            display: none;
            margin-bottom: 30px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        canvas {
            display: block;
            width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        .controls {
            display: none;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 30px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        .control-label {
            color: #fff;
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        input[type="color"] {
            width: 80px;
            height: 50px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: transparent;
        }

        .color-value {
            color: rgba(255, 255, 255, 0.8);
            font-family: monospace;
            font-size: 1rem;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #e94560;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider-value {
            color: #e94560;
            font-weight: 600;
            min-width: 50px;
            text-align: right;
        }

        .reset-btn {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 20px;
            width: 100%;
        }

        .reset-btn:hover {
            background: #e94560;
            border-color: #e94560;
        }

        .action-buttons {
            display: none;
            gap: 15px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #e94560;
            color: #fff;
        }

        .btn-primary:hover {
            background: #ff6b6b;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Photo Tint Studio</h1>
        <p class="subtitle">Upload a headshot and apply beautiful color tints</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📷</div>
            <div class="upload-text">Drop your image here or click to browse</div>
            <div class="upload-hint">Supports JPG, PNG, WEBP</div>
        </div>

        <input type="file" id="fileInput" accept="image/*">

        <div class="canvas-container" id="canvasContainer">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls" id="controls">
            <div class="control-group">
                <label class="control-label">Tint Color</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="colorPicker" value="#e94560">
                    <span class="color-value" id="colorValue">#e94560</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Tint Intensity</label>
                <div class="slider-container">
                    <input type="range" id="intensitySlider" min="0" max="100" value="50">
                    <span class="slider-value" id="intensityValue">50%</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Brightness</label>
                <div class="slider-container">
                    <input type="range" id="brightnessSlider" min="0" max="200" value="100">
                    <span class="slider-value" id="brightnessValue">100%</span>
                </div>
            </div>

            <div class="control-group">
                <label class="control-label">Contrast</label>
                <div class="slider-container">
                    <input type="range" id="contrastSlider" min="0" max="200" value="100">
                    <span class="slider-value" id="contrastValue">100%</span>
                </div>
            </div>

            <button class="reset-btn" id="resetBtn">Reset All Settings</button>
        </div>

        <div class="action-buttons" id="actionButtons">
            <button class="btn btn-secondary" id="newImageBtn">New Image</button>
            <button class="btn btn-primary" id="downloadBtn">Download</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const canvasContainer = document.getElementById('canvasContainer');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const controls = document.getElementById('controls');
        const actionButtons = document.getElementById('actionButtons');

        const colorPicker = document.getElementById('colorPicker');
        const colorValue = document.getElementById('colorValue');
        const intensitySlider = document.getElementById('intensitySlider');
        const intensityValue = document.getElementById('intensityValue');
        const brightnessSlider = document.getElementById('brightnessSlider');
        const brightnessValue = document.getElementById('brightnessValue');
        const contrastSlider = document.getElementById('contrastSlider');
        const contrastValue = document.getElementById('contrastValue');
        const resetBtn = document.getElementById('resetBtn');
        const newImageBtn = document.getElementById('newImageBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let originalImage = null;
        let originalImageData = null;

        // Upload handling
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleImage(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleImage(file);
            }
        });

        function handleImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;

                    // Set canvas size
                    const maxWidth = 800;
                    const scale = Math.min(1, maxWidth / img.width);
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;

                    // Draw original image
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                    // Convert to grayscale
                    convertToGrayscale();

                    // Show canvas and controls
                    uploadArea.style.display = 'none';
                    canvasContainer.style.display = 'block';
                    controls.style.display = 'block';
                    actionButtons.style.display = 'flex';

                    // Apply initial tint
                    applyTint();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function convertToGrayscale() {
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                data[i] = gray;
                data[i + 1] = gray;
                data[i + 2] = gray;
            }

            ctx.putImageData(imageData, 0, 0);
            originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        function applyTint() {
            if (!originalImageData) return;

            const tintColor = hexToRgb(colorPicker.value);
            const intensity = intensitySlider.value / 100;
            const brightness = brightnessSlider.value / 100;
            const contrast = contrastSlider.value / 100;

            const imageData = new ImageData(
                new Uint8ClampedArray(originalImageData.data),
                originalImageData.width,
                originalImageData.height
            );
            const data = imageData.data;

            for (let i = 0; i < data.length; i += 4) {
                let gray = data[i];

                // Apply contrast
                gray = ((gray - 128) * contrast) + 128;

                // Apply brightness
                gray = gray * brightness;

                // Clamp values
                gray = Math.max(0, Math.min(255, gray));

                // Apply tint
                data[i] = gray * (1 - intensity) + tintColor.r * intensity;
                data[i + 1] = gray * (1 - intensity) + tintColor.g * intensity;
                data[i + 2] = gray * (1 - intensity) + tintColor.b * intensity;
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 233, g: 69, b: 96 };
        }

        // Event listeners for controls
        colorPicker.addEventListener('input', (e) => {
            colorValue.textContent = e.target.value;
            applyTint();
        });

        intensitySlider.addEventListener('input', (e) => {
            intensityValue.textContent = e.target.value + '%';
            applyTint();
        });

        brightnessSlider.addEventListener('input', (e) => {
            brightnessValue.textContent = e.target.value + '%';
            applyTint();
        });

        contrastSlider.addEventListener('input', (e) => {
            contrastValue.textContent = e.target.value + '%';
            applyTint();
        });

        resetBtn.addEventListener('click', () => {
            colorPicker.value = '#e94560';
            colorValue.textContent = '#e94560';
            intensitySlider.value = 50;
            intensityValue.textContent = '50%';
            brightnessSlider.value = 100;
            brightnessValue.textContent = '100%';
            contrastSlider.value = 100;
            contrastValue.textContent = '100%';
            applyTint();
        });

        newImageBtn.addEventListener('click', () => {
            uploadArea.style.display = 'block';
            canvasContainer.style.display = 'none';
            controls.style.display = 'none';
            actionButtons.style.display = 'none';
            fileInput.value = '';
            originalImage = null;
            originalImageData = null;
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'tinted-photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
